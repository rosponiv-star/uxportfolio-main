</style></head><body><div class="slide">
<div class="k">01 · Smart Home Hub · Research</div>
<h1>Who the home serves, and how close they stand.</h1>
<p class="c">Stakeholders ranked by how directly they use the system. Primary users get full control or limited, delegated access; everyone else meets the home through a touchpoint.</p>
<svg viewBox="0 0 1300 1080" id="s">
 <defs>
  <pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#111" stroke-width="1" opacity=".3"/></pattern>
  <pattern id="h2" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="#111" stroke-width="1" opacity=".17"/></pattern>
  <pattern id="h3" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.1" fill="#111" opacity=".28"/></pattern>
 </defs>
</svg>
</div>
<script>
const s = document.getElementById('s'), C = [600, 535], NR = 50, PAD = 36;
let g = '';
const P = (r, a) => [C[0] + r * Math.cos(a * Math.PI / 180), C[1] - r * Math.sin(a * Math.PI / 180)];
// a group's leaf: the convex hull of its people (each grown by PAD) and a small stem near the hub, so every leaf
// opens from the centre like the reference's coloured fields
const hull = (pts) => { pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]); const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = []; for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1)); };
const leaf = (circles) => { const pts = []; circles.forEach(([x, y, r]) => { for (let i = 0; i < 72; i++) { const t = i / 72 * 2 * Math.PI; pts.push([x + r * Math.cos(t), y + r * Math.sin(t)]); } });
  const h = hull(pts); h.push(h[0]);
  // resample the hull evenly, then draw a closed Catmull-Rom spline through the samples: soft, organic edges
  const len = []; let tot = 0; for (let i = 1; i < h.length; i++) { tot += Math.hypot(h[i][0] - h[i - 1][0], h[i][1] - h[i - 1][1]); len.push(tot); }
  const K = Math.max(8, Math.round(tot / 150)), S = [];
  for (let k = 0; k < K; k++) { const d = k / K * tot; let i = len.findIndex((l) => l >= d); const l0 = i ? len[i - 1] : 0, f = (d - l0) / (len[i] - l0 || 1);
    S.push([h[i][0] + (h[i + 1][0] - h[i][0]) * f, h[i][1] + (h[i + 1][1] - h[i][1]) * f]); }
  let d = `M${S[0][0]} ${S[0][1]}`;
  for (let i = 0; i < K; i++) { const p0 = S[(i - 1 + K) % K], p1 = S[i], p2 = S[(i + 1) % K], p3 = S[(i + 2) % K];
    d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`; }
  return d + 'Z'; };
const RINGS = [240, 368, 445, 520];
RINGS.forEach((r) => (g += `<circle class="ring" cx="${C[0]}" cy="${C[1]}" r="${r}"/>`));
const N = [[1, 'Parents', 120], [1, 'Adult|children', 147], [1, 'Babysitter', 174], [1, 'Home|carers', 201], [1, 'Cleaners', 228],
  [2, 'Young|children', 74], [2, 'Guests', 46], [2, 'Acquain-|tances', 18], [2, 'Couriers', -10], [2, 'Techni-|cians', -38], [2, 'Wi-Fi|provider', -66],
  [3, 'Partner|company', 265]];
const L = [[1, 'PRIMARY', 174, 118, 34, 'h1'], [2, 'SECONDARY', 4, 128, 40, 'h2'], [3, 'TERTIARY', 265, 330, 46, 'h3']];   // ring, name, stem angle, stem r, stem size, fill
L.forEach(([ring, n, sa, sr, ss, h]) => { const cs = N.filter((d) => d[0] === ring).map(([, , a]) => [...P(RINGS[ring - 1], a), NR + PAD]);
  cs.push([...P(sr, sa), ss]);
  g += `<path d="${leaf(cs)}" fill="url(#${h})" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>`; });
N.forEach(([ring, t, a]) => { const [x, y] = P(RINGS[ring - 1], a), ls = t.split('|');
  g += `<circle cx="${x}" cy="${y}" r="${NR}" fill="#fdfdfc" stroke="#111" stroke-width="1.5"/>`;
  ls.forEach((l, i) => (g += `<text class="t" x="${x}" y="${y + 7 + (i - (ls.length - 1) / 2) * 22}">${l}</text>`)); });
g += `<circle cx="${C[0]}" cy="${C[1]}" r="96" fill="#111"/><text class="t" style="font-size:24px;fill:#fdfdfc" x="${C[0]}" y="${C[1] - 4}">Smart Home</text><text class="t" style="font-size:24px;fill:#fdfdfc" x="${C[0]}" y="${C[1] + 26}">Hub</text>`;
[['PRIMARY', 118, 345], ['SECONDARY', 4, 232], ['TERTIARY', 265, 345]].forEach(([n, a, r]) => { const [x, y] = P(r, a);
  g += `<text class="lb" x="${x}" y="${y + 5}" style="text-anchor:middle;paint-order:stroke;stroke:#fdfdfc;stroke-width:10px;stroke-linejoin:round">${n}</text>`; });
s.insertAdjacentHTML('beforeend', g);
</script></body></html>
