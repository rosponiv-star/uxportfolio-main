//   hand   — a person uses the device directly (keys, remotes, switches, intercom, thermostat)
//   remote — a command sent at a distance (remote → gate or garage, intercom → gate, router → TV, phone → irrigation)
//   auto   — one device triggers the next on its own (keys → alarm → security and door, door → light, climate chain, irrigation → mower)
//   sense  — a device sees or warns (camera → guests, owner and intercom; fire alarm → the owner inside)
// [from, to, kind, route, added]  route: 'xy' = along x first, 'yx' = along y first (lines follow the floor grid)
const E = [
 ['owner_out', 'remote_gar', 'hand', 'yx'], ['remote_gar', 'garage_sw', 'remote', 'yx'],
 ['owner_out', 'keys', 'hand', 'xy'], ['keys', 'alarm', 'auto', 'xy'], ['alarm', 'security', 'auto', 'xy'], ['alarm', 'door', 'auto', 'yx'],
 ['owner_out', 'remote_gate', 'hand', 'xy'], ['remote_gate', 'gate', 'remote', 'xy'],
 ['camera', 'owner_out', 'sense', 'yx'], ['camera', 'guests', 'sense', 'xy'],
 ['guests', 'intercom', 'hand', 'xy'], ['intercom', 'gate', 'remote', 'xy'],
 ['door', 'light_sw', 'auto', 'yx'], ['light_sw', 'light', 'auto', 'xy'], ['owner_in', 'light', 'hand', 'xy'],
 ['owner_in', 'ac', 'hand', 'yx'], ['ac', 'heating', 'auto', 'xy'], ['heating', 'thermostat', 'auto', 'xy'],
 ['owner_in', 'thermostat', 'hand', 'xy'], ['owner_in', 'router', 'hand', 'yx'], ['router', 'tv', 'remote', 'xy'],
 ['fire', 'owner_in', 'sense', 'xy'], ['owner_in', 'irrigation', 'remote', 'xy'], ['irrigation', 'mower', 'auto', 'yx'],
 // added after checking the sequences: the owner answers the intercom from inside; the camera is part of the intercom
 ['owner_in', 'intercom', 'hand', 'yx', 1], ['camera', 'intercom', 'sense', 'xy', 1],
];
const KIND = { hand: 'A person uses it, by hand', remote: 'A command sent at a distance', auto: 'One device triggers the next', sense: 'A device sees or warns' };
const N = { // node: icon, label, sensor
 remote_gar: ['remote', 'Remote'], garage_sw: ['garage', 'Garage door switch'], keys: ['key', 'Keys, entry code'], alarm: ['alarm', 'Alarm'],
 security: ['shield', 'Security systems'], door: ['door', 'Front door'], remote_gate: ['remote', 'Remote'], gate: ['gate', 'Gate'],
 camera: ['camera', 'Cameras', 1], intercom: ['intercom', 'Intercom'], light_sw: ['switch', 'Light switch'], light: ['bulb', 'Light'],
 fire: ['smoke', 'Fire alarm', 1], ac: ['climate', 'Air conditioner'], heating: ['heater', 'Heating'], thermostat: ['thermo', 'Thermostat, sensors', 1],
 router: ['router', 'Wi-Fi router'], tv: ['tv', 'Television'], irrigation: ['drop', 'Irrigation'], mower: ['robot', 'Mowing'] };
const PL = { owner_out: 'You, outside', guests: 'Guests', owner_in: 'You, inside' };
const badge = (x, y) => `<circle cx="${x}" cy="${y}" r="8" fill="#fdfdfc"/><circle cx="${x}" cy="${y}" r="6.5" fill="#111"/><path d="M${x - .6} ${y - 2.5}a3.5 3.5 0 0 1 0 5M${x + 1.7} ${y - 4.4}a6.2 6.2 0 0 1 0 8.8" fill="none" stroke="#fdfdfc" stroke-width="1.2" stroke-linecap="round"/><circle cx="${x - 2.7}" cy="${y}" r="1" fill="#fdfdfc"/>`;
const pin = (x, y, ic, sen) => `<circle cx="${x}" cy="${y}" r="22" fill="#fdfdfc"/><circle cx="${x}" cy="${y}" r="19" fill="#111"/><g transform="translate(${x - 12} ${y - 12})"><path class="ic ic-w" d="${I[ic]}"/></g>` + (sen ? badge(x + 16, y - 16) : '');
const pdot = (x, y) => `<circle cx="${x}" cy="${y}" r="11" fill="#fdfdfc"/><circle cx="${x}" cy="${y}" r="8" fill="#111"/><circle cx="${x}" cy="${y}" r="3" fill="#fdfdfc"/>`;
const fig = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path class="fig" d="M-8 0v-19q0-10 8-10t8 10v19zM-8 -13h16"/><circle class="fig" cx="0" cy="-36" r="6"/></g>`;
const swatch = (kind) => `<svg viewBox="0 0 64 30"><path class="halo" d="M4 15H60"/><path class="ln-${kind}" d="M4 15H60"${kind === 'sense' ? ' marker-end="url(#arrow)"' : ''}/></svg>`;

function network(A, zr, opts = {}) {
  const k = opts.k || 1;   // drawing units per slide px: keeps strokes, pins and text at their slide size on a zoomed drawing
  const P = (x, y, z) => [A.M[0][0] * x + A.M[0][1] * y + A.M[0][2] * z + A.M[0][3], A.M[1][0] * x + A.M[1][1] * y + A.M[1][2] * z + A.M[1][3]];
  const W = Object.assign({}, A.art3, A.people3);
  const T = (x, y, str) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${str}</g>`;
  // routes on the floor grid; segments that share a line get their own lane (0.42 m apart), so no two lines overlap
  const routes = E.map(([a, b, kind, route, added]) => {
    const pa = W[a], pb = W[b];
    const segs = route === 'xy' ? [{ o: 'h', c: pa[1], a0: pa[0], a1: pb[0] }, { o: 'v', c: pb[0], a0: pa[1], a1: pb[1] }]
                                : [{ o: 'v', c: pa[0], a0: pa[1], a1: pb[1] }, { o: 'h', c: pb[1], a0: pa[0], a1: pb[0] }];
    return { a, b, kind, route, added, pa, pb, segs: segs.filter((s) => Math.abs(s.a1 - s.a0) > 0.05) };
  });
  const groups = {};
  routes.forEach((r, i) => r.segs.forEach((s) => { (groups[s.o + Math.round(s.c / 0.25)] ||= []).push([i, s]); }));
  for (const g of Object.values(groups)) {
    // only segments that actually overlap along the line need separate lanes
    g.sort((p, q) => Math.min(p[1].a0, p[1].a1) - Math.min(q[1].a0, q[1].a1));
    const lanes = [];
    for (const [, s] of g) {
      const lo = Math.min(s.a0, s.a1), hi = Math.max(s.a0, s.a1);
      let l = lanes.findIndex((end) => end < lo - 0.3); if (l < 0) { l = lanes.length; lanes.push(0); }
      lanes[l] = hi; s.lane = l;
    }
    const n = lanes.length; g.forEach(([, s]) => { s.off = (s.lane - (n - 1) / 2) * 0.42; });
  }
  let halos = '', lines = '', nodes = '', labels = '', stems = '';
  const used = new Set();
  for (const r of routes) {
    used.add(r.a); used.add(r.b);
    // polyline in world metres: start, the offset segments, end
    const pts = [[r.pa[0], r.pa[1]]];
    const s1 = r.segs[0], s2 = r.segs[1];
    const off = (s) => (s ? s.off || 0 : 0);
    if (r.route === 'xy') {
      const y1 = r.pa[1] + off(s1), x2 = r.pb[0] + off(s2);
      pts.push([r.pa[0], y1], [x2, y1], [x2, r.pb[1]]);
    } else {
      const x1 = r.pa[0] + off(s1), y2 = r.pb[1] + off(s2);
      pts.push([x1, r.pa[1]], [x1, y2], [r.pb[0], y2]);
    }
    pts.push([r.pb[0], r.pb[1]]);
    const d = 'M' + pts.map(([x, y]) => P(x, y, zr).join(' ')).join('L');
    halos += `<path class="halo" d="${d}"/>`;
    lines += `<path class="ln-${r.kind}" d="${d}"${r.kind === 'sense' ? ' marker-end="url(#arrow)"' : ''}/>`;
  }
  for (const n of used) {
    const p = W[n], [lx, ly] = P(p[0], p[1], zr);
    const o = (opts.lab || {})[n] || [30, 6], anc = o[0] < 0 ? 'end' : o[0] > 0 ? 'start' : 'middle';
    if (N[n]) {
      nodes += T(lx, ly, pin(lx, ly, N[n][0], N[n][2]));
      labels += T(lx, ly, `<text class="lt" x="${lx + o[0]}" y="${ly + o[1]}" style="text-anchor:${anc}">${N[n][1]}</text>`);
    } else {
      const [px, py] = A.people[n];
      if (!opts.plan) stems += `<path class="stem" d="M${px} ${py - 56 * k}L${lx} ${ly}"/>`;
      nodes += T(lx, ly, pdot(lx, ly));
      labels += T(lx, ly, `<text class="lp" x="${lx + o[0]}" y="${ly + o[1]}" style="text-anchor:${anc}">${PL[n].toUpperCase()}</text>`);
    }
  }
  const defs = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${4.2}" markerHeight="${4.2}" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>`;
  return defs + halos + stems + lines + nodes + labels;
}

const A = AN['top'], box = [520, 0, 1400, 1080], zoom = 1.03, C = [14.6, 10.2];
const s = Math.min(box[2] / A.w, box[3] / A.h) * zoom, d = document.getElementById('d'), clip = document.getElementById('clip');
const c = [A.M[0][0] * C[0] + A.M[0][1] * C[1] + A.M[0][3], A.M[1][0] * C[0] + A.M[1][1] * C[1] + A.M[1][3]];
clip.style.left = box[0] + 'px'; clip.style.top = box[1] + 'px'; clip.style.width = box[2] + 'px'; clip.style.height = box[3] + 'px';
d.style.left = box[2] / 2 - c[0] * s + 'px'; d.style.top = box[3] / 2 - c[1] * s + 'px'; d.style.width = A.w * s + 'px'; d.style.height = A.h * s + 'px';
const ov = document.getElementById('ov'); ov.setAttribute('viewBox', `0 0 ${A.w} ${A.h}`);
ov.innerHTML = network(A, 0, { lab: {"ac": [0, -32], "heating": [30, 6], "thermostat": [-30, 6], "light_sw": [-30, 6], "light": [30, 6], "garage_sw": [-30, 6], "door": [-30, 6], "keys": [30, 6], "alarm": [0, 48], "security": [30, 6], "camera": [-30, 6], "gate": [0, -32], "intercom": [30, 6], "mower": [-30, 6], "irrigation": [-30, 6]}, k: 1 / s, plan: true });
for (const k of ['hand', 'remote', 'auto', 'sense']) document.getElementById('lg-' + k).innerHTML = swatch(k).replace('<svg ', '<svg ') + KIND[k];
document.querySelector('.leg').insertAdjacentHTML('afterbegin', '<svg width="0" height="0" style="position:absolute"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs></svg>');
document.getElementById('lgs').innerHTML = '<g transform="translate(26 15) scale(.68) translate(-26 -15)">' + pin(26, 15, 'smoke', 1) + '</g>';
document.getElementById('lgp').innerHTML = pdot(26, 15);
</script></body></html>
